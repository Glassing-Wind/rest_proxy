name: Local surface acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-surface:
    name: Disposable local surfaces (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      LM_PROXY_WATCHER_ENABLED: "0"
      LM_PROXY_MEMORY_ENABLED: "0"
      LM_PROXY_MEMORY_ENABLE_PERSISTENCE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install bounded local-surface dependencies
        run: |
          python -m pip install -r requirements-core.txt -r requirements-telemetry.txt
          python -m pip install pillow==13.0.0
          python -m pip check
      - name: Verify disposable listeners, process cleanup and task contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in test_repoanalyzer_adapter.py test_telemetry.py test_evidence_workspace_launch.py test_task_cockpit_http.py test_task_cockpit_launch.py test_task_review_fixture.py test_cockpit_eval.py; do
            if [[ -f "$test_file" ]]; then
              python "$test_file"
            else
              echo "Feature absent at this revision: $test_file"
            fi
          done
