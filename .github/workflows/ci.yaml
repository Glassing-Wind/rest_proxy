name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gated CI checks
        run: bash scripts/run_ci_checks.sh

  enterprise-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run enterprise eval
        run: python scripts/run_enterprise_eval.py --skip-graph

      - name: Read enterprise eval status
        if: always()
        id: enterprise-status
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          payload = json.loads(Path(".runtime/enterprise_eval/latest.json").read_text(encoding="utf-8"))
          trend = payload.get("trend_summary") or {}
          print(f"overall_status={trend.get('overall_status', 'unknown')}")
          PY

      - name: Publish enterprise eval summary
        if: always()
        run: python scripts/render_enterprise_eval_summary.py .runtime/enterprise_eval/latest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Render enterprise eval PR comment
        if: always() && github.event_name == 'pull_request' && steps.enterprise-status.outputs.overall_status != 'healthy'
        run: python scripts/render_enterprise_eval_summary.py --format comment .runtime/enterprise_eval/latest.json > .runtime/enterprise_eval/pr_comment.md

      - name: Update enterprise eval PR comment
        if: always() && github.event_name == 'pull_request' && steps.enterprise-status.outputs.overall_status != 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.runtime/enterprise_eval/pr_comment.md', 'utf8');
            const marker = '<!-- enterprise-eval-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload enterprise eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-eval-artifacts
          path: .runtime/enterprise_eval/
          if-no-files-found: error

  enterprise-live-graph-smoke:
    if: github.event_name == 'workflow_dispatch' || vars.LM_PROXY_ENABLE_LIVE_GRAPH_SMOKE == '1'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lm_proxy_mem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lm_proxy_mem"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -a bolt://localhost:7687 -u neo4j -p password 'RETURN 1;' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Neo4j
        env:
          LM_PROXY_NEO4J_URI: bolt://127.0.0.1:7687
          LM_PROXY_NEO4J_USER: neo4j
          LM_PROXY_NEO4J_PASSWORD: password
          LM_PROXY_NEO4J_DB: neo4j
          LM_PROXY_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/lm_proxy_mem
        run: |
          python - <<'PY'
          import asyncio
          import sys
          sys.path.insert(0, ".")
          import graph_bootstrap

          async def main():
              await graph_bootstrap.init_graph_db()

          asyncio.run(main())
          PY

      - name: Run enterprise live graph smoke
        env:
          LM_PROXY_ENTERPRISE_LIVE_GRAPH_WORKSPACES: ${{ vars.LM_PROXY_ENTERPRISE_LIVE_GRAPH_WORKSPACES }}
          LM_PROXY_NEO4J_URI: bolt://127.0.0.1:7687
          LM_PROXY_NEO4J_USER: neo4j
          LM_PROXY_NEO4J_PASSWORD: password
          LM_PROXY_NEO4J_DB: neo4j
          LM_PROXY_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/lm_proxy_mem
          LM_PROXY_FAKE_EMBEDDINGS: "1"
        run: bash scripts/run_enterprise_live_graph_smoke.sh

      - name: Publish live graph smoke summary
        if: always()
        env:
          LM_PROXY_ENTERPRISE_LIVE_GRAPH_WORKSPACES: ${{ vars.LM_PROXY_ENTERPRISE_LIVE_GRAPH_WORKSPACES }}
          LM_PROXY_NEO4J_URI: bolt://127.0.0.1:7687
          LM_PROXY_NEO4J_USER: neo4j
          LM_PROXY_NEO4J_PASSWORD: password
          LM_PROXY_NEO4J_DB: neo4j
          LM_PROXY_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/lm_proxy_mem
          LM_PROXY_FAKE_EMBEDDINGS: "1"
        run: |
          DEFAULT_FIXTURE="${GITHUB_WORKSPACE}/tests/fixtures/enterprise_live_graph_fixture"
          WORKSPACES="${LM_PROXY_ENTERPRISE_LIVE_GRAPH_WORKSPACES:-${DEFAULT_FIXTURE}}"
          {
            echo "## Enterprise Live Graph Smoke"
            echo ""
            echo "- Status: \`${{ job.status }}\`"
            echo "- Workspaces: \`${WORKSPACES}\`"
            echo "- Mode: \`incremental reindex + live graph goldens\`"
          } >> "$GITHUB_STEP_SUMMARY"
