name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gated CI checks
        run: bash scripts/run_ci_checks.sh

  enterprise-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run enterprise eval
        run: python scripts/run_enterprise_eval.py --skip-graph

      - name: Publish enterprise eval summary
        if: always()
        run: python scripts/render_enterprise_eval_summary.py .runtime/enterprise_eval/latest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload enterprise eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-eval-artifacts
          path: .runtime/enterprise_eval/
          if-no-files-found: error
